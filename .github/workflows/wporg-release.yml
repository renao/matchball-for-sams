name: WP.org Release Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-to-wporg-svn:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash zip unzip rsync subversion ca-certificates

      - name: Validate required secrets
        env:
          WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          test -n "$WPORG_SVN_USERNAME"
          test -n "$WPORG_SVN_PASSWORD"

      - name: Deploy release to WordPress.org SVN
        env:
          WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          WPORG_SVN_NON_INTERACTIVE: "true"
        run: |
          version="$(awk -F': ' '/^ \* Version:/ {print $2; exit}' matchball-for-sams.php | tr -d '[:space:]')"
          bash ./scripts/deploy-wporg-svn.sh --non-interactive --commit --message "Release ${version}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(awk -F': ' '/^ \* Version:/ {print $2; exit}' matchball-for-sams.php | tr -d '[:space:]')"
          tag="v${version}"
          zip_path="artifacts/releases/matchball-for-sams-${version}.zip"
          test -f "$zip_path"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_path" --clobber
          else
            gh release create "$tag" "$zip_path" --title "$tag" --generate-notes
          fi
