# Dependabot configuration
# Keeps GitHub Actions used in .github/workflows up to date (weekly, grouped in one PR).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
