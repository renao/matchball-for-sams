name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-and-build:
    runs-on: forgejo-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends php-cli shellcheck bash zip unzip rsync ca-certificates

      - name: PHP syntax check
        run: |
          find . -type f -name "*.php" -not -path "./artifacts/*" -print0 | xargs -0 -n1 php -l

      - name: Shell script lint
        run: |
          shellcheck scripts/*.sh

      - name: Version consistency check
        run: |
          plugin_version="$(awk -F': ' '/^ \* Version:/ {print $2; exit}' sams-integration.php | tr -d '[:space:]')"
          readme_version="$(awk -F': ' 'tolower($1)=="stable tag" {print $2; exit}' readme.txt | tr -d '[:space:]')"
          test -n "$plugin_version"
          test -n "$readme_version"
          test "$plugin_version" = "$readme_version"
          echo "Version check passed: $plugin_version"

      - name: Build release zip
        run: |
          bash ./scripts/create-release-zip.sh
          version="$(awk -F': ' '/^ \* Version:/ {print $2; exit}' sams-integration.php | tr -d '[:space:]')"
          test -f "artifacts/releases/sams-integration-${version}.zip"
          ls -lh "artifacts/releases/sams-integration-${version}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sams-integration-release-zip
          path: artifacts/releases/sams-integration-*.zip
          if-no-files-found: error
