services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-matchball}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.1-php8.3-apache
    container_name: ${COMPOSE_PROJECT_NAME:-matchball}_wp
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      MATCHBALL_API_KEY: ${MATCHBALL_API_KEY:-}
      MATCHBALL_API_KEY_SAMS_V2: ${MATCHBALL_API_KEY_SAMS_V2:-}
      MATCHBALL_SOURCE_ID: ${MATCHBALL_SOURCE_ID:-sams-v2}
      MATCHBALL_SEASON_UUID: ${MATCHBALL_SEASON_UUID:-}
      MATCHBALL_LEAGUE_UUID: ${MATCHBALL_LEAGUE_UUID:-}
      MATCHBALL_TEAM_UUID: ${MATCHBALL_TEAM_UUID:-}
      WP_DEBUG: ${WP_DEBUG:-1}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-1}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-0}
      PLUGIN_CHECK_SKIP_INSTALL: ${PLUGIN_CHECK_SKIP_INSTALL:-0}
      WORDPRESS_CONFIG_EXTRA: |
        if (file_exists('/var/www/html/wp-content/plugins/matchball/docker/wp-config-extra.php')) {
            require_once '/var/www/html/wp-content/plugins/matchball/docker/wp-config-extra.php';
        }
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/matchball
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-includes/version.php"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  wpcli:
    image: wordpress:cli-php8.3
    container_name: ${COMPOSE_PROJECT_NAME:-matchball}_wpcli
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Matchball - Standings & Tables for SAMS Dev}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-test}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-test}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.local}
      MATCHBALL_API_KEY: ${MATCHBALL_API_KEY:-}
      MATCHBALL_API_KEY_SAMS_V2: ${MATCHBALL_API_KEY_SAMS_V2:-}
      MATCHBALL_SOURCE_ID: ${MATCHBALL_SOURCE_ID:-sams-v2}
      MATCHBALL_SEASON_UUID: ${MATCHBALL_SEASON_UUID:-}
      MATCHBALL_LEAGUE_UUID: ${MATCHBALL_LEAGUE_UUID:-}
      MATCHBALL_TEAM_UUID: ${MATCHBALL_TEAM_UUID:-}
      PLUGIN_CHECK_SKIP_INSTALL: ${PLUGIN_CHECK_SKIP_INSTALL:-0}
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/matchball
    healthcheck:
      test: ["CMD-SHELL", "wp core is-installed && wp plugin is-active matchball"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    entrypoint: ["/bin/sh", "/var/www/html/wp-content/plugins/matchball/docker/wp-setup.sh"]

volumes:
  db_data:
  wp_data:
