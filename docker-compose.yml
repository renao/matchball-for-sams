services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-sams-integration-ki}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.5-php8.2-apache
    container_name: ${COMPOSE_PROJECT_NAME:-sams-integration-ki}_wp
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        if (file_exists('/var/www/html/wp-content/plugins/sams-integration-ki/docker/wp-config-extra.php')) {
            require_once '/var/www/html/wp-content/plugins/sams-integration-ki/docker/wp-config-extra.php';
        }
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/sams-integration-ki

volumes:
  db_data:
  wp_data:
