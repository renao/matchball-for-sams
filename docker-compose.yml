services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-easy-sams}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.1-php8.3-apache
    container_name: ${COMPOSE_PROJECT_NAME:-easy-sams}_wp
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      ESAMS_API_KEY: ${ESAMS_API_KEY:-}
      ESAMS_API_KEY_SAMS_V2: ${ESAMS_API_KEY_SAMS_V2:-}
      ESAMS_SOURCE_ID: ${ESAMS_SOURCE_ID:-sams-v2}
      ESAMS_SEASON_UUID: ${ESAMS_SEASON_UUID:-}
      ESAMS_LEAGUE_UUID: ${ESAMS_LEAGUE_UUID:-}
      ESAMS_TEAM_UUID: ${ESAMS_TEAM_UUID:-}
      WP_DEBUG: ${WP_DEBUG:-1}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-1}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-0}
      PLUGIN_CHECK_SKIP_INSTALL: ${PLUGIN_CHECK_SKIP_INSTALL:-0}
      WORDPRESS_CONFIG_EXTRA: |
        if (file_exists('/var/www/html/wp-content/plugins/easy-sams/docker/wp-config-extra.php')) {
            require_once '/var/www/html/wp-content/plugins/easy-sams/docker/wp-config-extra.php';
        }
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/easy-sams
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-includes/version.php"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  wpcli:
    image: wordpress:cli-php8.3
    container_name: ${COMPOSE_PROJECT_NAME:-easy-sams}_wpcli
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Easy SAMS Dev}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-test}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-test}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.local}
      ESAMS_API_KEY: ${ESAMS_API_KEY:-}
      ESAMS_API_KEY_SAMS_V2: ${ESAMS_API_KEY_SAMS_V2:-}
      ESAMS_SOURCE_ID: ${ESAMS_SOURCE_ID:-sams-v2}
      ESAMS_SEASON_UUID: ${ESAMS_SEASON_UUID:-}
      ESAMS_LEAGUE_UUID: ${ESAMS_LEAGUE_UUID:-}
      ESAMS_TEAM_UUID: ${ESAMS_TEAM_UUID:-}
      PLUGIN_CHECK_SKIP_INSTALL: ${PLUGIN_CHECK_SKIP_INSTALL:-0}
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/easy-sams
    entrypoint: sh
    command:
      - -c
      - |
        if wp core is-installed 2>/dev/null; then
          echo "WordPress already installed, skipping setup."
        else
          wp core install \
            --url="$$WP_HOME" \
            --title="$$WP_TITLE" \
            --admin_user="$$WP_ADMIN_USER" \
            --admin_password="$$WP_ADMIN_PASSWORD" \
            --admin_email="$$WP_ADMIN_EMAIL" \
            --skip-email
        fi
        wp plugin activate easy-sams
        # Plugin Check installieren
        if [ "$$PLUGIN_CHECK_SKIP_INSTALL" != "1" ]; then
          wp plugin install wordpress/plugin-check --activate
        fi
        if wp post list --post_type=page --post_status=any --name=easy-sams-demo --format=ids 2>/dev/null | grep -q .; then
          echo "Demo page already exists, skipping."
        else
          DEMO_CONTENT="<!-- wp:heading --><h2 class=\"wp-block-heading\">Tabelle</h2><!-- /wp:heading --><!-- wp:esams/standings {\"sourceId\":\"$$ESAMS_SOURCE_ID\",\"seasonUuid\":\"$$ESAMS_SEASON_UUID\",\"leagueUuid\":\"$$ESAMS_LEAGUE_UUID\",\"teamUuid\":\"$$ESAMS_TEAM_UUID\"} /--><!-- wp:heading --><h2 class=\"wp-block-heading\">Ergebnisse / Spielplan</h2><!-- /wp:heading --><!-- wp:esams/results {\"sourceId\":\"$$ESAMS_SOURCE_ID\",\"seasonUuid\":\"$$ESAMS_SEASON_UUID\",\"leagueUuid\":\"$$ESAMS_LEAGUE_UUID\",\"teamUuid\":\"$$ESAMS_TEAM_UUID\",\"includeFuture\":true} /-->"
          wp post create \
            --post_type=page \
            --post_title="Easy SAMS Demo" \
            --post_name=easy-sams-demo \
            --post_status=publish \
            --post_content="$$DEMO_CONTENT"
          echo "Demo-Seite erstellt: $$WP_HOME/easy-sams-demo/"
        fi

volumes:
  db_data:
  wp_data:
