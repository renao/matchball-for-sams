steps:
  wporg_svn_release:
    image: debian:12-slim
    environment:
      WPORG_SVN_USERNAME:
        from_secret: wporg_svn_username
      WPORG_SVN_PASSWORD:
        from_secret: wporg_svn_password
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends bash zip unzip rsync subversion ca-certificates
      - test -n "$WPORG_SVN_USERNAME"
      - test -n "$WPORG_SVN_PASSWORD"
      - version="$(awk -F': ' '/^ \* Version:/ {print $2; exit}' sams-integration.php | tr -d '[:space:]')"
      - bash ./scripts/deploy-wporg-svn.sh --non-interactive --commit --message "Release ${version}"
    when:
      event:
        - deployment
      target:
        - wporg-release
      branch:
        - main
